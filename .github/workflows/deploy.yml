name: Deploy to Production

# Self-hosted runner di Gandongan (192.168.1.89 = host ini sendiri).
# Tidak ada SSH, tidak ada Cloudflare tunnel, tidak ada secrets SSH.
# Sumber: /mnt/disk1/home-relocated/Documents/project_joki/cvku (path device asli,
# bukan symlink /home/roo/Documents).
# DB produksi: shared-postgres (container cvku-db sudah exited dan TIDAK dipakai app).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan manual deploy (optional)'
        required: false
        default: 'Manual trigger from GitHub Actions'

concurrency:
  group: production-deploy
  cancel-in-progress: false  # JANGAN cancel deploy yang sedang jalan

jobs:
  deploy:
    name: Backup + Deploy + Verify
    runs-on: [self-hosted, gandongan]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: /mnt/disk1/home-relocated/Documents/project_joki/cvku

    steps:
      - name: Preflight
        run: |
          set -euo pipefail
          echo "host       : $(hostname)"
          echo "user       : $(whoami)"
          echo "pwd        : $(pwd)"
          echo "repo owner : $(stat -c '%U:%G' .)"
          test -f docker-compose.yml || { echo "FAIL: bukan repo cvku"; exit 1; }
          test -f .env || { echo "FAIL: .env hilang - compose tidak akan resolve"; exit 1; }
          docker compose version >/dev/null || { echo "FAIL: docker compose tidak ada"; exit 1; }
          docker inspect shared-postgres >/dev/null 2>&1 \
            || { echo "FAIL: shared-postgres tidak ada - itu DB produksi"; exit 1; }
          echo "shared-postgres running=$(docker inspect shared-postgres --format '{{.State.Running}}')"
          docker compose config --services | sed 's/^/compose service: /'

      - name: Backup database (pg_dump from shared-postgres) + verify
        run: |
          set -euo pipefail
          BACKUP_DIR="/home/cvku-ops/backups"
          mkdir -p "$BACKUP_DIR"
          BACKUP_FILE="cvku-$(date +%Y-%m-%d_%H%M%S).sql"
          docker exec shared-postgres pg_dump -U cvku -d cvku > "$BACKUP_DIR/$BACKUP_FILE"
          gzip "$BACKUP_DIR/$BACKUP_FILE"

          echo "--- verifikasi isi dump (bukan cuma exit code) ---"
          TABLES=$(gunzip -c "$BACKUP_DIR/$BACKUP_FILE.gz" | grep -c '^CREATE TABLE' || true)
          COPIES=$(gunzip -c "$BACKUP_DIR/$BACKUP_FILE.gz" | grep -c '^COPY ' || true)
          BYTES=$(stat -c %s "$BACKUP_DIR/$BACKUP_FILE.gz")
          echo "  CREATE TABLE : $TABLES"
          echo "  COPY blocks  : $COPIES"
          echo "  size (gz)    : $BYTES bytes"

          if [ "${TABLES:-0}" -lt 5 ] || [ "${BYTES:-0}" -lt 1000 ]; then
            echo "FAIL: dump terlihat kosong (tables=$TABLES bytes=$BYTES) - JANGAN lanjut deploy"
            exit 1
          fi
          echo "BACKUP_PATH=$BACKUP_DIR/$BACKUP_FILE.gz" >> $GITHUB_ENV
          echo "BACKUP_TABLES=$TABLES" >> $GITHUB_ENV
          echo "BACKUP_BYTES=$BYTES" >> $GITHUB_ENV
          ls -t "$BACKUP_DIR"/cvku-*.sql.gz 2>/dev/null | tail -n +31 | xargs -r rm -f

      - name: Pull latest code
        run: |
          set -euo pipefail
          git rev-parse HEAD > /home/cvku-ops/.last-deployed-commit
          git fetch origin main
          git reset --hard origin/main
          echo "DEPLOYED_SHA=$(git rev-parse HEAD | cut -c1-7)" >> $GITHUB_ENV
          echo "DEPLOYED_MSG=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Build & restart containers
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          docker compose build web
          docker compose up -d --force-recreate web
          sleep 10
          echo "DEPLOY_START=$START_TIME" >> $GITHUB_ENV

      - name: Health check (local :9013)
        id: health
        run: |
          HTTP_STATUS=000
          for i in 1 2 3 4 5 6 7 8; do
            HTTP_STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:9013/ 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then break; fi
            sleep 5
          done
          echo "HTTP_STATUS=$HTTP_STATUS" >> $GITHUB_ENV
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: health check failed (HTTP $HTTP_STATUS)"
            echo "--- cvku-web logs (tail) ---"
            docker logs cvku-web --tail 40 2>&1 || true
            exit 1
          fi
          echo "OK: health check passed (localhost:9013)"

      - name: Calculate duration
        if: success()
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - DEPLOY_START))
          echo "Deploy duration: $((DURATION/60))m $((DURATION%60))s"
          echo "DEPLOY_DURATION=$((DURATION/60))m $((DURATION%60))s" >> $GITHUB_ENV

      - name: Deploy summary
        if: success()
        run: |
          echo "## CVKu Deploy Sukses" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** gandongan (self-hosted)" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://cvku.ksm.web.id" >> $GITHUB_STEP_SUMMARY
          echo "- **Health (local :9013):** $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** $DEPLOY_DURATION" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** $DEPLOYED_SHA" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** $DEPLOYED_MSG" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup:** $BACKUP_PATH ($BACKUP_TABLES tabel, $BACKUP_BYTES bytes)" >> $GITHUB_STEP_SUMMARY

      - name: Deploy failure summary
        if: failure()
        run: |
          echo "## CVKu Deploy GAGAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${DEPLOYED_SHA:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production mungkin broken. Cek logs di link di atas." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback manual:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cd /mnt/disk1/home-relocated/Documents/project_joki/cvku" >> $GITHUB_STEP_SUMMARY
          echo "git reset --hard \$(cat /home/cvku-ops/.last-deployed-commit)" >> $GITHUB_STEP_SUMMARY
          echo "docker compose build web && docker compose up -d --force-recreate web" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY