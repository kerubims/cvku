services:
  db:
    image: postgres:16-alpine
    container_name: cvku-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cvku}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:9014:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvku} -d ${POSTGRES_DB:-cvku}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cvku-net
      - shared-db-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvku-web
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cvku:***@shared-postgres:5432/cvku
      NOVITA_API_KEY: ${NOVITA_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      IRON_SESSION_PASSWORD: ${IRON_SESSION_PASSWORD}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://192.168.1.89:20129/v1}
    ports:
      - "9013:3000"
    networks:
      - cvku-net
      - shared-db-net

  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    container_name: cvku-studio
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required - set in .env}
    ports:
      - "9015:9015"
    networks:
      - cvku-net
      - shared-db-net

volumes:
  pgdata:
    name: cvku_pgdata

networks:
  cvku-net:
    name: cvku-net
    driver: bridge
  shared-db-net:
    external: true
